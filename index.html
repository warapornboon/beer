<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ใส่รหัสเปิดอ่านข้อความ</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Sukhumvit Set', 'Segoe UI', Tahoma, sans-serif;
    }

    body {
      background-color: #fde2e4;
      color: #4a3e3d;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #ffccd5;
      border-radius: 24px;
      padding: 30px 20px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(255, 182, 193, 0.3);
    }

    .icon {
      font-size: 40px;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 22px;
      color: #ff4d6d;
      margin-bottom: 8px;
    }

    p.subtitle {
      font-size: 14px;
      color: #a4133c;
      margin-bottom: 25px;
      opacity: 0.7;
    }

    .input-container {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 25px;
    }

    .code-input {
      width: 60px;
      height: 70px;
      background: #fff0f3;
      border: 2px solid #ffb3c1;
      border-radius: 16px;
      font-size: 32px;
      font-weight: bold;
      color: #ff4d6d;
      text-align: center;
      outline: none;
      transition: all 0.2s ease;
    }

    .code-input:focus {
      border-color: #ff4d6d;
      box-shadow: 0 0 10px rgba(255, 77, 109, 0.3);
      background: #ffffff;
    }

    .btn {
      width: 100%;
      padding: 14px;
      background-color: #ff758f;
      color: #ffffff;
      border: none;
      border-radius: 25px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(255, 117, 143, 0.4);
      transition: all 0.2s ease;
    }

    .btn:hover {
      background-color: #ff4d6d;
    }

    .secret-box {
      display: none;
      animation: fadeIn 0.4s ease forwards;
    }

    .secret-text {
      font-size: 16px;
      line-height: 1.6;
      color: #590d22;
      background: #fff0f3;
      padding: 20px;
      border-radius: 18px;
      border: 1px solid #ffccd5;
      margin-bottom: 15px;
      text-align: left;
    }

    .highlight {
      color: #ff4d6d;
      font-weight: bold;
      text-align: center;
      margin-top: 15px;
      font-size: 18px;
    }

    .error-msg {
      color: #ff4d6d;
      font-size: 14px;
      margin-top: 10px;
      display: none;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="card">
    <div id="lock-screen">
      <div class="icon">🎀</div>
      <h2>ใส่รหัส 2 หลักนะ</h2>
      <p class="subtitle">พิมพ์ตัวเลขเพื่อเปิดอ่านข้อความ</p>
      
      <div class="input-container">
        <input type="number" maxlength="1" class="code-input" id="digit1" pattern="[0-9]*" inputmode="numeric">
        <input type="number" maxlength="1" class="code-input" id="digit2" pattern="[0-9]*" inputmode="numeric">
      </div>

      <button class="btn" onclick="checkCode()">เปิดอ่านเลย</button>
      <div class="error-msg" id="error-msg">รหัสไม่ถูกต้อง ลองใหม่อีกทีนะ!</div>
    </div>

    <div id="secret-screen" class="secret-box">
      <div class="icon">💗</div>
      <div class="secret-text" id="message-content"></div>
    </div>
  </div>

  <script>
    // ตั้งค่ารหัสผ่านและข้อความลับตรงนี้
    const SECRET_MESSAGES = {
      "16": `คืองี้ใช่ไหม คือเมื่อวานก่อนอ่ะเค้าบ่นกับพ่อแม่ว่า เค้าอยากได้รถ และทีนี้พ่อแม่เค้าก็พูดว่า "เดี๋ยวพรุ่งนี้พาไปซื้อรถนะ" และทีนี้วันนี้เค้าก็มาซื้อรถจริงๆ มีหลายคันมาก เลือกไม่ถูกเลยแหละ แบบมันหลายคันจริงๆ แต่เค้ามีคันที่ชอบนะ คันถึงเธอทุกวิด<br><br><div class="highlight">"คิดถึงเธอทุกวัน" &gt;&lt; 💖</div>`,
      "01": "ข้อความต้อนรับสำหรับรหัส 01 สดใสทุกวันนะ!",
      "02": "ข้อความพิเศษสำหรับรหัส 02 ตั้งใจทำให้นะ!"
    };

    const d1 = document.getElementById('digit1');
    const d2 = document.getElementById('digit2');

    d1.addEventListener('input', () => {
      if (d1.value.length >= 1) {
        d1.value = d1.value.slice(0, 1);
        d2.focus();
      }
    });

    d2.addEventListener('input', () => {
      if (d2.value.length >= 1) {
        d2.value = d2.value.slice(0, 1);
      }
    });

    function checkCode() {
      const inputCode = d1.value + d2.value;
      const errorMsg = document.getElementById('error-msg');
      
      if (SECRET_MESSAGES[inputCode]) {
        document.getElementById('lock-screen').style.display = 'none';
        document.getElementById('message-content').innerHTML = SECRET_MESSAGES[inputCode];
        document.getElementById('secret-screen').style.display = 'block';
      } else {
        errorMsg.style.display = 'block';
        d1.value = '';
        d2.value = '';
        d1.focus();
      }
    }
  </script>
</body>
</html>
